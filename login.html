<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuition Management - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-graduation-cap text-blue-600"></i> Tuition Portal</h1>
      <p class="text-gray-500 mt-2">Sign in to your account</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700">Role</label>
        <select id="role" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
          <option value="admin">Admin</option>
          <option value="student">Student</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Username / Student ID</label>
        <input type="text" id="username" required class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="admin_user or TIE1">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="••••••••">
      </div>

      <div class="flex items-center">
        <input id="keepSignedIn" type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 rounded">
        <label for="keepSignedIn" class="ml-2 block text-sm text-gray-900">Keep me signed in</label>
      </div>

      <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition font-medium flex justify-center items-center">
        <span>Sign In</span> <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
      </button>
      <p id="errorMsg" class="text-red-500 text-sm text-center hidden"></p>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7Q4nKX35FU54JgLEyj7HSCRktuHOWX6MCNcHpTcNKLJs_TIfCCEDAvcteRM0sXcWBkw/exec";

    // Auto-redirect if already logged in
    window.onload = () => {
      const token = localStorage.getItem('token') || sessionStorage.getItem('token');
      const role = localStorage.getItem('role') || sessionStorage.getItem('role');
      if (token && role) window.location.href = role === 'admin' ? 'admin.html' : 'student.html';
    };

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
      btn.disabled = true;
      err.classList.add('hidden');

      const role = document.getElementById('role').value;
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const keep = document.getElementById('keepSignedIn').checked;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=login&role=${role}&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
        const data = await res.json();

        if (data.ok) {
          const storage = keep ? localStorage : sessionStorage;
          storage.setItem('token', data.token);
          storage.setItem('role', data.role);
          if (data.studentId) storage.setItem('studentId', data.studentId);
          window.location.href = data.role === 'admin' ? 'admin.html' : 'student.html';
        } else {
          err.innerText = data.msg;
          err.classList.remove('hidden');
        }
      } catch (error) {
        err.innerText = "Network error. Please try again.";
        err.classList.remove('hidden');
      }
      btn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>';
      btn.disabled = false;
    });
  </script>
</body>
</html>
