<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HsTakeItEasy Portal</title>
  <link rel="icon" href="https://i.ibb.co/RGjnSG5z/image.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <!-- Custom Alert Modal (Centered) -->
  <div id="customAlert" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm transition-all duration-300 opacity-0 pointer-events-none">
    <div id="customAlertBox" class="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-all duration-300 relative">
      
      <!-- Close 'X' Button -->
      <button onclick="closeError()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition bg-gray-50 hover:bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="p-8 text-center mt-2">
        <!-- Error Icon -->
        <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-5 border-[6px] border-red-100/50">
          <i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl"></i>
        </div>
        
        <!-- Main Title -->
        <h3 class="text-2xl font-black text-gray-900 mb-2 tracking-tight">Login Failed</h3>
        
        <!-- Explanation Message -->
        <p id="customAlertText" class="text-gray-500 font-medium text-sm mb-8 leading-relaxed">
          We couldn't verify your details. Please check your credentials and try again.
        </p>
        
        <!-- Close Button -->
        <button onclick="closeError()" class="w-full bg-gray-900 text-white font-bold text-lg py-3.5 rounded-xl shadow-lg shadow-gray-900/20 hover:bg-gray-800 transition active:scale-95">
          Try Again
        </button>
      </div>
    </div>
  </div>

  <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-white/50 relative overflow-hidden">
    
    <!-- Decorative background blobs -->
    <div class="absolute top-[-50px] right-[-50px] w-32 h-32 bg-blue-100 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
    <div class="absolute bottom-[-50px] left-[-50px] w-32 h-32 bg-indigo-100 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

    <div class="relative z-10">
      
      <!-- Logo & Title -->
      <div class="text-center mb-8 pt-4">
        <img src="https://i.ibb.co/RGjnSG5z/image.png" alt="HsTakeItEasy Logo" class="w-20 h-20 mx-auto rounded-2xl shadow-md border border-gray-100 object-cover mb-4">
        <h1 class="text-2xl font-black text-gray-900 tracking-tight">HsTakeItEasy Portal</h1>
        <p class="text-sm text-gray-500 font-medium mt-1">Sign in to continue</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="doLogin(event)" class="space-y-5">
        
        <!-- Role Selection -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Select Role</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-users"></i>
            </div>
            <select id="role" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition appearance-none">
              <!-- Defaulted to Student as requested -->
              <option value="student" selected>Student</option>
              <option value="admin">Admin</option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <!-- Username / Student ID -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Admin / StudentID</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-user"></i>
            </div>
            <input type="text" id="username" required placeholder=" Enter your StudentID (TIE1)" 
              class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input type="password" id="password" required placeholder="Enter password " 
              class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-blue-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg shadow-blue-600/30 hover:bg-blue-700 transition active:scale-95 flex items-center justify-center mt-2">
          <span id="loginBtnText">Sign In</span>
          <i id="loginSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
        </button>

      </form>
      
    </div>
  </div>

  <script>
    // --- REPLACE THIS URL WITH YOUR DEPLOYMENT URL ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7Q4nKX35FU54JgLEyj7HSCRktuHOWX6MCNcHpTcNKLJs_TIfCCEDAvcteRM0sXcWBkw/exec";

    // Custom UI Alert Functions
    function showError(message) {
      const alertBox = document.getElementById('customAlert');
      const alertInner = document.getElementById('customAlertBox');
      const alertText = document.getElementById('customAlertText');
      
      alertText.textContent = message;
      
      // Fade in background
      alertBox.classList.remove('opacity-0', 'pointer-events-none');
      alertBox.classList.add('opacity-100', 'pointer-events-auto');
      
      // Pop in the modal
      alertInner.classList.remove('scale-95');
      alertInner.classList.add('scale-100');
    }

    function closeError() {
      const alertBox = document.getElementById('customAlert');
      const alertInner = document.getElementById('customAlertBox');
      
      // Fade out background
      alertBox.classList.remove('opacity-100', 'pointer-events-auto');
      alertBox.classList.add('opacity-0', 'pointer-events-none');
      
      // Scale down the modal
      alertInner.classList.remove('scale-100');
      alertInner.classList.add('scale-95');
    }

    // If already logged in, redirect
    if(localStorage.getItem('token')) {
      const role = localStorage.getItem('role');
      if(role === 'admin') window.location.href = 'admin.html';
      if(role === 'student') window.location.href = 'student.html';
    }

    async function doLogin(e) {
      e.preventDefault();
      
      const btnText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');
      
      btnText.classList.add('hidden');
      spinner.classList.remove('hidden');
      
      const role = document.getElementById('role').value;
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      
      try {
        const res = await fetch(`${SCRIPT_URL}?action=login&role=${role}&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&_t=${new Date().getTime()}`);
        const data = await res.json();
        
        if(data.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          
          if(data.role === 'student') {
            localStorage.setItem('studentId', data.studentId);
            window.location.href = 'student.html';
          } else {
            window.location.href = 'admin.html';
          }
        } else {
          // Trigger the centered modal with the error message
          showError(data.msg || "Invalid credentials. Please try again.");
          btnText.classList.remove('hidden');
          spinner.classList.add('hidden');
        }
      } catch(err) {
        console.error(err);
        // Trigger the centered modal with a network error message
        showError("Network Error. Please check your internet connection.");
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
