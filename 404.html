<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d9488">
  <title>404 — Page Not Found</title>
  <style>
    :root {
      --primary: #0d9488;
      --primary-bright: #2dd4bf;
      --bg: #f5f8fa;
      --surface: rgba(255,255,255,.78);
      --text: #14232d;
      --muted: #718096;
      --border: rgba(13,148,136,.15);
      --glow: rgba(13,148,136,.17);
    }
    [data-theme="dark"] {
      --primary: #2dd4bf;
      --primary-bright: #5eead4;
      --bg: #08131c;
      --surface: rgba(17,31,43,.78);
      --text: #e7f2f4;
      --muted: #9aafba;
      --border: rgba(45,212,191,.17);
      --glow: rgba(45,212,191,.13);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden; display: grid; place-items: center;
      padding: 28px; color: var(--text); background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background .3s, color .3s;
    }
    body::before, body::after {
      content: ""; position: fixed; width: 430px; height: 430px; border-radius: 50%;
      filter: blur(75px); opacity: .55; pointer-events: none; z-index: -2;
      background: var(--glow); animation: blob 12s ease-in-out infinite alternate;
    }
    body::before { top: -190px; left: -140px; }
    body::after { bottom: -220px; right: -130px; animation-delay: -5s; }
    .grid-bg {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .28;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, black, transparent 78%);
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; padding: 22px clamp(20px, 5vw, 72px);
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 850; letter-spacing: -.5px; }
    .brand-icon {
      width: 35px; height: 35px; border-radius: 11px; display: grid; place-items: center;
      background: var(--primary); color: #fff; font-size: 17px; box-shadow: 0 7px 20px var(--glow);
    }
    .theme-btn {
      width: 40px; height: 40px; border-radius: 13px; border: 1px solid var(--border);
      color: var(--text); background: var(--surface); cursor: pointer; font-size: 17px;
      backdrop-filter: blur(12px); transition: transform .2s, border-color .2s;
    }
    .theme-btn:hover { transform: rotate(12deg) scale(1.05); border-color: var(--primary); }
    main { width: min(760px, 100%); text-align: center; padding: 45px 0 30px; position: relative; }
    .scene {
      height: clamp(210px, 32vw, 280px); position: relative; display: grid; place-items: center;
      margin: 0 auto 4px; isolation: isolate;
    }
    .orbit {
      position: absolute; width: 245px; height: 245px; border: 1px dashed var(--border);
      border-radius: 50%; animation: spin 28s linear infinite;
    }
    .orbit::before, .orbit::after {
      content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--primary-bright);
      box-shadow: 0 0 18px var(--primary);
    }
    .orbit::before { top: 27px; left: 28px; }
    .orbit::after { bottom: 35px; right: 16px; width: 7px; height: 7px; }
    .orbit-two {
      position: absolute; width: 190px; height: 190px; border: 1px solid var(--border);
      border-radius: 50%; animation: spin 18s linear infinite reverse;
    }
    .orbit-two::after { content: "✦"; position: absolute; top: 15px; right: 22px; color: var(--primary); font-size: 18px; }
    .error-number {
      position: relative; z-index: 2; display: flex; align-items: center; justify-content: center;
      gap: 4px; font-size: clamp(104px, 19vw, 174px); line-height: .9; font-weight: 950;
      letter-spacing: -13px; color: var(--text); text-shadow: 0 15px 45px var(--glow);
      animation: float 4s ease-in-out infinite;
    }
    .zero {
      width: .82em; height: .82em; display: inline-grid; place-items: center; margin: 0 5px;
      border: .075em solid var(--primary); border-radius: 50%; position: relative;
      color: transparent; box-shadow: 0 0 0 12px var(--glow), inset 0 0 25px var(--glow);
    }
    .zero::before {
      content: ""; width: .22em; height: .22em; border-radius: 50%; background: var(--primary);
      box-shadow: 0 0 18px var(--primary); animation: pulse 2s ease-in-out infinite;
    }
    .zero::after {
      content: ""; position: absolute; width: 1.08em; height: 2px; background: var(--primary);
      transform: rotate(-45deg); opacity: .65; border-radius: 5px;
    }
    .spark {
      position: absolute; color: var(--primary); font-size: 19px; animation: twinkle 2.2s ease-in-out infinite;
    }
    .s1 { top: 18%; left: 21%; } .s2 { top: 22%; right: 19%; animation-delay: .7s; font-size: 13px; }
    .s3 { bottom: 17%; left: 27%; animation-delay: 1.1s; font-size: 12px; } .s4 { bottom: 19%; right: 25%; animation-delay: .3s; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 30px;
      color: var(--primary); background: var(--glow); border: 1px solid var(--border);
      font-size: 10px; font-weight: 850; letter-spacing: 1.6px; text-transform: uppercase;
    }
    .eyebrow i { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); }
    h1 { margin: 18px 0 10px; font-size: clamp(27px, 5vw, 39px); letter-spacing: -1.4px; font-weight: 850; }
    .description { max-width: 440px; margin: 0 auto; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 11px; margin-top: 27px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 47px;
      padding: 0 20px; border-radius: 13px; text-decoration: none; font-size: 12px; font-weight: 800;
      transition: transform .2s, box-shadow .2s, background .2s;
    }
    .btn:hover { transform: translateY(-3px); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 9px 24px var(--glow); }
    .btn-primary:hover { box-shadow: 0 13px 30px var(--glow); }
    .btn-secondary { color: var(--text); background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(12px); }
    .footer { position: fixed; bottom: 19px; left: 0; right: 0; color: var(--muted); text-align: center; font-size: 10px; letter-spacing: .2px; }
    .footer span { color: var(--primary); font-weight: 800; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
    @keyframes pulse { 0%,100% { transform: scale(.8); opacity: .7; } 50% { transform: scale(1.25); opacity: 1; } }
    @keyframes twinkle { 0%,100% { transform: scale(.65) rotate(0); opacity: .35; } 50% { transform: scale(1.25) rotate(35deg); opacity: 1; } }
    @keyframes blob { from { transform: translate(0,0) scale(1); } to { transform: translate(65px,45px) scale(1.2); } }
    @media (max-width: 520px) {
      body { padding: 20px; }
      .topbar { padding: 17px 20px; }
      .scene { height: 220px; }
      .orbit { width: 205px; height: 205px; }
      .orbit-two { width: 160px; height: 160px; }
      .error-number { letter-spacing: -8px; }
      .description { font-size: 13px; }
      .footer { bottom: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <header class="topbar">
    <div class="brand"><span class="brand-icon">S</span><span>StudySpace</span></div>
    <button class="theme-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">☾</button>
  </header>

  <main>
    <div class="scene" aria-hidden="true">
      <div class="orbit"></div><div class="orbit-two"></div>
      <span class="spark s1">✦</span><span class="spark s2">✧</span>
      <span class="spark s3">✧</span><span class="spark s4">✦</span>
      <div class="error-number"><span>4</span><span class="zero">0</span><span>4</span></div>
    </div>
    <div class="eyebrow"><i></i> Lost in the digital space</div>
    <h1>Oops! Page not found.</h1>
    <p class="description">
      Looks like this page took a little detour. The link may be broken,
      or the page may have moved. Let's get you back on track.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">← Back to dashboard</a>
      <a class="btn btn-secondary" href="javascript:history.back()">Go back <span>↗</span></a>
    </div>
  </main>

  <footer class="footer">Made for curious minds · <span>StudySpace</span></footer>

  <script>
    const toggle = document.getElementById("themeToggle");
    const saved = localStorage.getItem("student-dashboard-theme") || "light";
    document.documentElement.dataset.theme = saved;
    toggle.textContent = saved === "dark" ? "☀" : "☾";

    toggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("student-dashboard-theme", next);
      toggle.textContent = next === "dark" ? "☀" : "☾";
    });
  </script>
</body>
</html>
