<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Community — Tuition Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; padding-bottom: 90px; }
    .nav-center-btn { transform: translateY(-20px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); }
    textarea, input[type="text"], input[type="password"] { -webkit-appearance: none; }
    .comment-box { display: none; }
    .comment-box.open { display: block; animation: slideDown 0.25s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .btn-loading { pointer-events: none; opacity: 0.8; }
  </style>
</head>
<body class="text-gray-800">

  <div id="globalLoader" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden flex-col justify-center items-center">
    <i class="fa-solid fa-circle-notch fa-spin text-white text-5xl mb-4"></i>
    <p class="text-white font-semibold tracking-wider text-lg">Loading...</p>
  </div>

  <div class="bg-blue-600 text-white p-6 rounded-b-[2rem] shadow-lg">
    <div class="flex justify-between items-center mb-2">
      <a href="student.html" class="text-white text-xl"><i class="fa-solid fa-arrow-left"></i></a>
      <h1 class="text-lg font-bold tracking-wide">Community</h1>
      <button onclick="logoutCommunity()" id="logoutBtn" class="text-white text-lg hidden" title="Log out">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
    <p id="communityWho" class="text-blue-100 text-xs font-mono tracking-widest mt-2">Not signed in</p>
  </div>

  <div class="p-5">

    <!-- Login gate -->
    <div id="loginGate" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <p class="text-sm text-gray-500 mb-3">
        <i class="fa-solid fa-lock text-blue-500 mr-1"></i>
        Sign in with your Student ID and password to post and comment.
      </p>
      <input id="cLoginId" type="text" placeholder="Student ID" autocomplete="username"
        class="w-full border border-gray-200 rounded-xl p-3 mb-2 text-sm focus:outline-none focus:border-blue-500">
      <input id="cLoginPass" type="password" placeholder="Password" autocomplete="current-password"
        class="w-full border border-gray-200 rounded-xl p-3 mb-3 text-sm focus:outline-none focus:border-blue-500">
      <button id="loginBtn" onclick="communityLogin()"
        class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl active:scale-95 transition">
        Sign In
      </button>
      <p id="cLoginErr" class="text-red-500 text-xs mt-2 hidden"></p>
    </div>

    <!-- Feed area -->
    <div id="communityMain" class="hidden space-y-4">

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <textarea id="cPostText" rows="3" placeholder="What's on your mind?"
          class="w-full border border-gray-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500"></textarea>
        <div class="flex items-center justify-between mt-2">
          <label class="text-xs text-gray-500 font-semibold flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-image text-blue-500"></i>
            <span>Add image</span>
            <input id="cPostFile" type="file" accept="image/*" class="hidden">
          </label>
        </div>
        <img id="cPostPreview" class="mt-2 max-h-40 rounded-lg hidden">
        <button id="postBtn" onclick="communityPost()"
          class="w-full mt-3 bg-blue-600 text-white font-bold py-3 rounded-xl active:scale-95 transition">
          Post
        </button>
        <p id="cPostErr" class="text-red-500 text-xs mt-2 hidden"></p>
      </div>

      <div id="cFeed" class="space-y-3">
        <p class="text-gray-400 text-center py-4 text-sm"><i class="fa-solid fa-spinner fa-spin"></i> Loading feed...</p>
      </div>
    </div>
  </div>

  <div class="fixed bottom-0 w-full bg-white flex justify-between items-end px-2 pb-safe shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.05)] rounded-t-2xl border-t border-gray-100 z-40">
    <div class="flex w-2/5 justify-evenly pb-2 pt-3">
      <a href="student.html" class="flex flex-col items-center text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-house text-xl mb-1"></i>
        <span class="text-[10px] font-bold tracking-wide">HOME</span>
      </a>
      <a href="student.html#fees" class="flex flex-col items-center text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-wallet text-xl mb-1"></i>
        <span class="text-[10px] font-bold tracking-wide">FEES</span>
      </a>
    </div>
    <div class="w-1/5 flex justify-center pb-2">
      <div class="nav-center-btn bg-blue-600 text-white w-14 h-14 rounded-full flex flex-col items-center justify-center">
        <i class="fa-solid fa-users text-xl"></i>
      </div>
    </div>
    <div class="flex w-2/5 justify-evenly pb-2 pt-3">
      <a href="student.html#marks" class="flex flex-col items-center text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-award text-xl mb-1"></i>
        <span class="text-[10px] font-bold tracking-wide">ACADEMICS</span>
      </a>
      <a href="student.html#notice" class="flex flex-col items-center text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-bullhorn text-xl mb-1"></i>
        <span class="text-[10px] font-bold tracking-wide">NOTICE</span>
      </a>
    </div>
  </div>

  <script>
    const COMMUNITY_API = 'https://script.google.com/macros/s/AKfycbwUcfo-HIwXdMZN6bDNe9A90p0ceX_reb59p5K6jLyXeUkCPgMMSkTkEH5uI9FAkvtR4w/exec';
    const STORAGE_KEY = 'community_auth';

    let cStudentId = null;

    // ===== Helpers =====
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function showErr(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg; el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 6000);
    }
    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result.split(',')[1]);
        r.onerror = () => rej(new Error('Could not read file'));
        r.readAsDataURL(file);
      });
    }
    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleString();
    }

    // ===== Login persistence =====
    function saveLogin(studentId) {
      // Save in BOTH storages so it survives tab close (local) and refreshes (session).
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ studentId: studentId, ts: Date.now() }));
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ studentId: studentId, ts: Date.now() }));
      } catch (e) { /* private mode may block; ignore */ }
    }
    function loadLogin() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !obj.studentId) return null;
        return obj.studentId;
      } catch (e) { return null; }
    }
    function clearLogin() {
      try {
        localStorage.removeItem(STORAGE_KEY);
        sessionStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
    }

    // ===== UI state helpers =====
    function showLoggedIn(studentId) {
      cStudentId = studentId;
      document.getElementById('loginGate').classList.add('hidden');
      document.getElementById('communityMain').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('communityWho').textContent = 'Signed in as ' + studentId;
      loadFeed();
    }

    function showLoggedOut() {
      cStudentId = null;
      document.getElementById('loginGate').classList.remove('hidden');
      document.getElementById('communityMain').classList.add('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('communityWho').textContent = 'Not signed in';
    }

    function logoutCommunity() {
      clearLogin();
      showLoggedOut();
    }

    // ===== Login =====
    async function communityLogin() {
      const id = document.getElementById('cLoginId').value.trim();
      const pw = document.getElementById('cLoginPass').value.trim();
      const btn = document.getElementById('loginBtn');
      if (!id || !pw) return showErr('cLoginErr', 'Enter Student ID and password.');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Verifying...';

      try {
        const res = await fetch(
          `${COMMUNITY_API}?action=login&studentId=${encodeURIComponent(id)}&password=${encodeURIComponent(pw)}`
        );
        const data = await res.json();
        if (!data.success) {
          showErr('cLoginErr', data.error || 'Login failed.');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }
        saveLogin(data.studentId);
        document.getElementById('cLoginPass').value = '';
        showLoggedIn(data.studentId);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      } catch (e) {
        showErr('cLoginErr', 'Network error: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    // ===== New post =====
    document.getElementById('cPostFile').addEventListener('change', function (e) {
      const p = document.getElementById('cPostPreview');
      const f = e.target.files[0];
      if (f) { p.src = URL.createObjectURL(f); p.classList.remove('hidden'); }
      else { p.classList.add('hidden'); p.src = ''; }
    });

    async function communityPost() {
      if (!cStudentId) return showErr('cPostErr', 'Not logged in.');
      const text = document.getElementById('cPostText').value.trim();
      const file = document.getElementById('cPostFile').files[0];
      if (!text && !file) return showErr('cPostErr', 'Write something or add an image.');

      const btn = document.getElementById('postBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Posting...';

      try {
        let b64 = null;
        if (file) b64 = await fileToBase64(file);
        const res = await fetch(COMMUNITY_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'createPost',
            text: text,
            base64Image: b64,
            studentId: cStudentId
          })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Post failed.');
        document.getElementById('cPostText').value = '';
        document.getElementById('cPostFile').value = '';
        document.getElementById('cPostPreview').classList.add('hidden');
        loadFeed();
      } catch (e) {
        showErr('cPostErr', e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Post';
      }
    }

    // ===== Feed =====
    async function loadFeed() {
      const box = document.getElementById('cFeed');
      try {
        const res = await fetch(`${COMMUNITY_API}?action=feed`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Feed load failed.');
        const posts = data.posts || [];
        if (!posts.length) {
          box.innerHTML = '<p class="text-gray-400 text-center py-4 text-sm">No posts yet. Be the first to share!</p>';
          return;
        }
        box.innerHTML = posts.map(renderPost).join('');
      } catch (e) {
        box.innerHTML = `<p class="text-red-500 text-center py-4 text-sm">${escapeHtml(e.message)}</p>`;
      }
    }

    function renderPost(p) {
      const tag = p.studentId
        ? `<span class="inline-block bg-blue-50 text-blue-600 text-[10px] font-bold px-2 py-1 rounded-full mb-2">${escapeHtml(p.studentId)}</span>`
        : '';
      const txt = p.text
        ? `<p class="text-sm whitespace-pre-wrap mb-2 leading-relaxed">${escapeHtml(p.text)}</p>`
        : '';
      const img = p.imageUrl
        ? `<img src="${escapeHtml(p.imageUrl)}" class="w-full rounded-lg mb-2" loading="lazy" alt="post image">`
        : '';

      const commentCount = (p.comments || []).length;
      const safeId = String(p.id || '').replace(/[^a-zA-Z0-9-]/g, '');

      const commentsHtml = (p.comments || []).map(c => {
        const ctag = c.studentId
          ? `<span class="inline-block bg-gray-200 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full mb-1">${escapeHtml(c.studentId)}</span>`
          : '';
        const ctxt = c.text ? `<p class="text-xs whitespace-pre-wrap">${escapeHtml(c.text)}</p>` : '';
        const cimg = c.imageUrl ? `<img src="${escapeHtml(c.imageUrl)}" class="max-w-[180px] rounded mt-1" loading="lazy">` : '';
        return `<div class="bg-gray-100 rounded-lg p-2 mb-1">${ctag}${ctxt}${cimg}</div>`;
      }).join('');

      return `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
          ${tag}${txt}${img}
          <p class="text-[10px] text-gray-400 mb-2">${formatTime(p.timestamp)}</p>

          <!-- Comment toggle -->
          <button id="ctoggle-${safeId}" onclick="toggleComments('${safeId}')"
            class="w-full flex items-center justify-center gap-2 text-xs font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 active:bg-blue-100 py-2 rounded-lg transition">
            <i class="fa-regular fa-comment"></i>
            <span>Comments (${commentCount})</span>
          </button>

          <!-- Hidden comment box -->
          <div id="cbox-${safeId}" class="comment-box mt-2 border-t pt-2">
            ${commentsHtml || '<p class="text-xs text-gray-400 text-center py-2">No comments yet.</p>'}
            <div class="mt-2">
              <input type="text" id="ct-${safeId}" placeholder="Write a comment..."
                class="w-full border border-gray-200 rounded-lg p-2 text-xs mb-1 focus:outline-none focus:border-blue-500">
              <input type="file" id="cf-${safeId}" accept="image/*" class="text-[10px] text-gray-500 mb-1">
              <button id="cbtn-${safeId}" onclick="submitComment('${p.id}', '${safeId}')"
                class="w-full bg-blue-50 text-blue-600 font-bold py-2 rounded-lg text-xs active:scale-95 transition">
                <i class="fa-regular fa-paper-plane mr-1"></i> Comment
              </button>
              <p id="ce-${safeId}" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
          </div>
        </div>`;
    }

    // ===== Comment toggle =====
    function toggleComments(safeId) {
      const box = document.getElementById('cbox-' + safeId);
      const btn = document.getElementById('ctoggle-' + safeId);
      if (!box) return;
      const isOpen = box.classList.toggle('open');
      // change toggle button color when open
      if (isOpen) {
        btn.classList.remove('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
        btn.classList.add('bg-blue-100', 'text-blue-700');
      } else {
        btn.classList.remove('bg-blue-100', 'text-blue-700');
        btn.classList.add('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
      }
    }

    // ===== Submit comment =====
    async function submitComment(postId, safeId) {
      if (!cStudentId) return alert('Not logged in.');
      const textEl = document.getElementById('ct-' + safeId);
      const fileEl = document.getElementById('cf-' + safeId);
      const btn = document.getElementById('cbtn-' + safeId);
      const text = textEl.value.trim();
      const file = fileEl.files[0];
      if (!text && !file) return showErr('ce-' + safeId, 'Write or add image.');

      // Visual feedback: change to blue solid + spinner
      const oldHtml = btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('btn-loading');
      btn.classList.remove('bg-blue-50', 'text-blue-600');
      btn.classList.add('bg-blue-600', 'text-white');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Posting...';

      try {
        let b64 = null;
        if (file) b64 = await fileToBase64(file);
        const res = await fetch(COMMUNITY_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'createComment',
            postId: postId,
            text: text,
            base64Image: b64,
            studentId: cStudentId
          })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Comment failed.');

        // Success: green flash then reload feed
        btn.classList.remove('bg-blue-600');
        btn.classList.add('bg-green-500');
        btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> Posted!';
        setTimeout(() => loadFeed(), 600);
        return;
      } catch (e) {
        showErr('ce-' + safeId, e.message);
        // Revert on error
        btn.disabled = false;
        btn.classList.remove('btn-loading', 'bg-blue-600', 'text-white');
        btn.classList.add('bg-blue-50', 'text-blue-600');
        btn.innerHTML = oldHtml;
      }
    }

    // ===== Init =====
    window.addEventListener('load', () => {
      const saved = loadLogin();
      if (saved) {
        // Auto-login from cache — no password prompt, no server round-trip.
        showLoggedIn(saved);
      } else {
        // Prefill ID from dashboard's session if available
        const dashId = localStorage.getItem('studentId') || sessionStorage.getItem('studentId');
        if (dashId) document.getElementById('cLoginId').value = dashId;
      }
    });
  </script>
</body>
</html>
