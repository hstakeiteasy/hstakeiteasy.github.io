<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Challenge - HSTakeItEasy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
    @keyframes glow { 0% { box-shadow: 0 0 5px rgba(99, 102, 241, 0.4); } 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.8), 0 0 30px rgba(99, 102, 241, 0.6); } }
    .btn-glow { animation: glow 1.5s infinite alternate; }
    .quiz-option { transition: all 0.2s ease-in-out; }
    .quiz-option.selected { border-color: #4f46e5 !important; background-color: #e0e7ff !important; font-weight: 800; color: #4f46e5; }
    .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-gray-800 p-4 md:p-8 flex justify-center min-h-screen items-start pt-10">

  <div class="w-full max-w-md">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 px-2">
      <div>
        <h1 class="text-2xl font-black text-gray-800 tracking-tight"><i class="fa-solid fa-brain text-indigo-600 mr-2"></i>Quiz Portal</h1>
        <p class="text-xs text-gray-500 font-medium mt-1">Player: <span id="displayStudentName" class="text-indigo-600 font-bold">Loading...</span></p>
      </div>
      <button onclick="returnToPortal()" class="w-10 h-10 bg-white rounded-full shadow-sm text-gray-400 hover:text-red-500 flex items-center justify-center transition border border-gray-100"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>

    <!-- 1. HOME / LEADERBOARD SCREEN -->
    <div id="screen-home" class="screen active space-y-6">
      
      <!-- Personal Dashboard Stats -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-indigo-600 text-white rounded-2xl p-4 shadow-sm text-center">
          <p class="text-[10px] font-bold uppercase tracking-wider mb-1 opacity-80">Daily Rank</p>
          <p id="dashRankDaily" class="text-2xl font-black">#--</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Weekly</p>
          <p id="dashRankWeekly" class="text-2xl font-black text-gray-800">#--</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Overall</p>
          <p id="dashRankOverall" class="text-2xl font-black text-gray-800">#--</p>
        </div>
      </div>

      <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-gray-100">
        <!-- Tabs -->
        <div class="flex bg-gray-100 rounded-full p-1 mb-6">
          <button id="tab-daily" onclick="switchTab('daily')" class="flex-1 py-2 text-xs font-bold rounded-full bg-white text-indigo-600 shadow-sm transition-all">Daily</button>
          <button id="tab-weekly" onclick="switchTab('weekly')" class="flex-1 py-2 text-xs font-bold rounded-full text-gray-500 hover:text-gray-800 transition-all">Weekly</button>
          <button id="tab-allTime" onclick="switchTab('allTime')" class="flex-1 py-2 text-xs font-bold rounded-full text-gray-500 hover:text-gray-800 transition-all">Overall</button>
        </div>

        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 px-2"><i class="fa-solid fa-crown text-yellow-500 mr-1"></i> Top 3 Performers</h3>

        <!-- Leaderboard Lists -->
        <div class="min-h-[150px]">
          <div id="lb-daily" class="space-y-3"><p class="text-center text-gray-400 py-6 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading...</p></div>
          <div id="lb-weekly" class="space-y-3 hidden"></div>
          <div id="lb-allTime" class="space-y-3 hidden"></div>
        </div>
      </div>

      <button onclick="startChallenge()" class="w-full bg-gray-900 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-95 btn-glow flex items-center justify-center gap-2 text-lg">
        <i class="fa-solid fa-play"></i> START CHALLENGE
      </button>
    </div>

    <!-- 2. ACTIVE QUIZ SCREEN -->
    <div id="screen-quiz" class="screen bg-white rounded-[2rem] p-6 shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
        <span id="questionCount" class="text-xs font-black text-gray-400 bg-gray-100 px-3 py-1.5 rounded-lg tracking-wider">Q 1/5</span>
        <span id="timerDisplay" class="text-2xl font-black text-indigo-600 flex items-center gap-2 font-mono"><i class="fa-regular fa-clock text-lg text-indigo-400"></i> 05:00</span>
      </div>
      <h3 id="questionText" class="text-lg font-bold text-gray-800 mb-6 leading-snug">Loading question...</h3>
      <div id="optionsContainer" class="space-y-3 mb-8"></div>
      <button id="nextBtn" onclick="nextQuestion()" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl shadow-sm hover:bg-black transition active:scale-95 hidden">Next Question</button>
    </div>

    <!-- 3. RESULT SCREEN -->
    <div id="screen-result" class="screen bg-white rounded-[2rem] p-8 shadow-sm border border-gray-100 text-center relative overflow-hidden">
      <div class="absolute -top-10 -right-10 text-9xl text-indigo-50 opacity-50 z-0"><i class="fa-solid fa-trophy"></i></div>
      <div class="relative z-10">
        <i class="fa-solid fa-circle-check text-5xl text-green-500 mb-4"></i>
        <h2 class="text-2xl font-black text-gray-800 mb-1">Challenge Completed!</h2>
        <p class="text-sm text-gray-500 mb-6">Scores submitted successfully.</p>
        
        <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 mb-6">
          <p class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-1">Total Score</p>
          <h1 id="finalScore" class="text-6xl font-black text-indigo-600">--</h1>
        </div>
        
        <button onclick="returnHome()" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl hover:bg-black transition active:scale-95">Return to Dashboard</button>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyVJ-gPQWSqjcEwISrKO1OuXU3fCuGs2PHpbDHfAqYoT2x3BEAc8MdGnysSgypHG0E/exec";
    
    // Centralized function to return to the student portal
    function returnToPortal() {
      // If the portal is hstakeiteasy.github.io, we redirect there. 
      // It also safely attempts to close the tab if opened via target="_blank"
      window.close(); 
      window.location.href = "https://hstakeiteasy.github.io/"; 
    }

    // Auth & Name Check
    const studentId = localStorage.getItem('studentId') || sessionStorage.getItem('studentId');
    const studentName = localStorage.getItem('studentName') || sessionStorage.getItem('studentName');

    // Strict validation: Block entry if ID or Name is missing
    if (!studentId || !studentName) {
      document.body.innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-screen text-center px-6">
          <div class="bg-red-50 text-red-500 w-20 h-20 rounded-full flex items-center justify-center text-4xl mb-4"><i class="fa-solid fa-triangle-exclamation"></i></div>
          <h2 class="text-2xl font-black text-gray-800 mb-2">Profile Incomplete</h2>
          <p class="text-gray-500 mb-8 font-medium">Please reopen your app or logout and then login.</p>
          <button onclick="returnToPortal()" class="bg-gray-900 text-white px-8 py-3.5 rounded-xl font-bold shadow-md hover:bg-black transition active:scale-95 flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Portal
          </button>
        </div>`;
      throw new Error("Unauthorized access or missing name.");
    }
    
    document.getElementById('displayStudentName').innerText = studentName;

    let quizData = [], currentIndex = 0, userAnswers = [], timerInterval, timeLeft = 300;
    
    // Updated Marking Scheme
    const POSITIVE_MARK = 2;
    const NEGATIVE_MARK = -1;

    // Initialization
    loadLeaderboard();

    async function fetchAPI(action, params = {}) {
      try {
        let url = `${API_URL}?action=${action}&_t=${Date.now()}`;
        Object.keys(params).forEach(k => url += `&${k}=${encodeURIComponent(params[k])}`);
        const res = await fetch(url);
        return await res.json();
      } catch (err) { return { ok: false }; }
    }

    function switchTab(tab) {
      ['daily', 'weekly', 'allTime'].forEach(t => {
        document.getElementById(`lb-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'flex-1 py-2 text-xs font-bold rounded-full text-gray-500 hover:text-gray-800 transition-all bg-transparent shadow-none';
      });
      document.getElementById(`lb-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'flex-1 py-2 text-xs font-bold rounded-full bg-white text-indigo-600 shadow-sm transition-all';
    }

    async function loadLeaderboard() {
      const res = await fetchAPI('getLeaderboard', { studentId: studentId });
      
      const buildHtml = (arr) => arr.map(r => {
        const isMe = String(r.id) === String(studentId);
        const rankColor = r.rank === 1 ? 'text-yellow-500' : (r.rank === 2 ? 'text-gray-400' : (r.rank === 3 ? 'text-orange-400' : 'text-gray-300'));
        const bgStyle = isMe ? 'bg-indigo-50 border-indigo-200 shadow-md' : 'bg-white border-gray-100';
        
        return `
        <div class="flex justify-between items-center p-3.5 ${bgStyle} border rounded-xl shadow-sm transition">
          <div class="flex items-center gap-3">
            <span class="w-6 text-center font-black ${rankColor} text-lg">#${r.rank}</span>
            <div class="flex flex-col">
              <span class="font-bold text-gray-800 text-sm">${r.name} ${isMe ? '<span class="text-[9px] bg-indigo-600 text-white px-1.5 py-0.5 rounded-full ml-1 font-bold">YOU</span>' : ''}</span>
            </div>
          </div>
          <span class="text-sm font-black text-indigo-600 bg-white border border-indigo-100 px-2.5 py-1 rounded-lg">${r.score} pts</span>
        </div>`;
      }).join('') || "<p class='text-center text-sm text-gray-400 py-6'>No scores yet. Be the first!</p>";

      if (res.ok) {
        document.getElementById('lb-daily').innerHTML = buildHtml(res.leaderboard.daily);
        document.getElementById('lb-weekly').innerHTML = buildHtml(res.leaderboard.weekly);
        document.getElementById('lb-allTime').innerHTML = buildHtml(res.leaderboard.overall);
        
        document.getElementById('dashRankDaily').innerText = `#${res.myRanks.daily}`;
        document.getElementById('dashRankWeekly').innerText = `#${res.myRanks.weekly}`;
        document.getElementById('dashRankOverall').innerText = `#${res.myRanks.overall}`;
      } else {
        document.getElementById('lb-daily').innerHTML = "<p class='text-red-500 text-center py-4'>Failed to load data.</p>";
      }
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(`screen-${screenId}`).classList.add('active');
    }

    async function startChallenge() {
      showScreen('quiz');
      document.getElementById('questionText').innerText = "Fetching your questions...";
      document.getElementById('optionsContainer').innerHTML = '';
      document.getElementById('nextBtn').classList.add('hidden');
      
      const res = await fetchAPI('getQuiz');
      
      if (res.ok && res.questions && res.questions.length > 0) {
        quizData = res.questions;
        userAnswers = new Array(quizData.length).fill(null);
        currentIndex = 0;
        timeLeft = 300;
        
        renderQuestion();
        startTimer();
      } else {
        alert("Failed to load questions. Check your database.");
        returnHome();
      }
    }

    function renderQuestion() {
      const q = quizData[currentIndex];
      document.getElementById('questionCount').innerText = `Q ${currentIndex + 1}/${quizData.length}`;
      document.getElementById('questionText').innerText = q.question;
      
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      
      q.options.forEach((opt, index) => {
        const optNum = index + 1;
        const isSelected = userAnswers[currentIndex] === optNum;
        
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-4 rounded-xl border-2 transition-all quiz-option flex items-center gap-3 ${isSelected ? 'selected' : 'border-gray-100 bg-gray-50 hover:bg-gray-100 hover:border-gray-200 text-gray-600 font-medium'}`;
        btn.innerHTML = `<span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${isSelected ? 'bg-indigo-600 text-white' : 'bg-white text-gray-400 border border-gray-200'} shrink-0">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(optNum);
        container.appendChild(btn);
      });

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.classList.remove('hidden');
      if (currentIndex === quizData.length - 1) {
        nextBtn.innerText = "Submit Challenge";
        nextBtn.className = "w-full bg-indigo-600 text-white font-black py-3.5 rounded-xl shadow-md hover:bg-indigo-700 transition active:scale-95";
      } else {
        nextBtn.innerText = "Next Question";
        nextBtn.className = "w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl shadow-sm hover:bg-black transition active:scale-95";
      }
    }

    function selectOption(optNum) { userAnswers[currentIndex] = optNum; renderQuestion(); }

    function nextQuestion() {
      if (currentIndex < quizData.length - 1) { currentIndex++; renderQuestion(); } 
      else { finishChallenge(); }
    }

    function startTimer() {
      const display = document.getElementById('timerDisplay');
      display.classList.remove('text-red-500', 'animate-pulse');
      display.classList.add('text-indigo-600');
      
      timerInterval = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        display.innerHTML = `<i class="fa-regular fa-clock text-lg"></i> ${m}:${s}`;
        
        if (timeLeft <= 60) {
          display.classList.remove('text-indigo-600');
          display.classList.add('text-red-500', 'animate-pulse');
        }
        if (timeLeft <= 0) finishChallenge();
      }, 1000);
    }

    async function finishChallenge() {
      clearInterval(timerInterval);
      showScreen('result');
      
      let score = 0;
      quizData.forEach((q, i) => {
        if (userAnswers[i] === q.answer) score += POSITIVE_MARK;
        else if (userAnswers[i] !== null) score += NEGATIVE_MARK;
      });

      document.getElementById('finalScore').innerText = score;
      await fetchAPI('submitScore', { studentId: studentId, studentName: studentName, score: score });
    }

    function returnHome() {
      showScreen('home');
      document.getElementById('dashRankDaily').innerHTML = '<i class="fa-solid fa-spinner fa-spin text-white"></i>';
      document.getElementById('dashRankWeekly').innerHTML = '<i class="fa-solid fa-spinner fa-spin text-gray-300"></i>';
      document.getElementById('dashRankOverall').innerHTML = '<i class="fa-solid fa-spinner fa-spin text-gray-300"></i>';
      loadLeaderboard(); 
    }
  </script>
</body>
</html>
